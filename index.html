<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Basurero IoT</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .dashboard {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .header p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-badge.connected {
      background: rgba(34, 197, 94, 0.15);
      color: var(--ok);
    }
    .status-badge.connected .status-dot {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .status-badge.reconnecting {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warn);
    }
    .status-badge.reconnecting .status-dot {
      background: var(--warn);
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }
    .status-badge.error .status-dot {
      background: var(--danger);
    }

    .bin-main {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      flex-wrap: wrap;
    }

    .bin-graphic {
      width: 96px;
      height: 136px;
      border: 4px solid var(--muted);
      border-top: none;
      border-radius: 0 0 14px 14px;
      position: relative;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.65);
      flex-shrink: 0;
    }

    .bin-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: var(--ok);
      transition: height 0.5s ease, background-color 0.5s ease;
    }

    .metrics {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .percent-value {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }

    .state-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    .details-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-top: 0.5rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--muted);
    }

    .details-row strong {
      color: var(--accent);
      font-size: 1rem;
    }

    .height-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }

    .height-control input {
      width: 78px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }

    .chart-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <!-- Tarjeta única del contenedor -->
    <section class="card">
      <div class="header">
        <div>
          <h1>Contenedor Principal</h1>
          <p>Tópico: <code>esp32/distancia</code></p>
        </div>
        <div id="statusBadge" class="status-badge">
          <span class="status-dot"></span>
          <span id="statusText">Desconectado</span>
        </div>
      </div>

      <div class="bin-main">
        <div class="bin-graphic">
          <div id="binFill" class="bin-fill"></div>
        </div>

        <div class="metrics">
          <div id="percentValue" class="percent-value">--%</div>
          <div id="stateLabel" class="state-label">Esperando lectura...</div>

          <div class="details-row">
            <div>Distancia a basura: <strong id="distanceValue">-- cm</strong></div>
            <div>Actualizado: <strong id="lastUpdate">--:--:--</strong></div>
          </div>
        </div>
      </div>

      <div class="height-control">
        <label for="heightInput">Altura total del contenedor (cm):</label>
        <input id="heightInput" type="number" min="5" max="300" value="50" />
      </div>
    </section>

    <!-- Historial del contenedor -->
    <section class="card">
      <div class="chart-title">Historial de distancia (últimas 20 lecturas)</div>
      <div class="chart-container">
        <canvas id="distanceChart"></canvas>
      </div>
    </section>
  </main>

  <script>
    // Configuración fija del contenedor único
    const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
    const TOPIC = "esp32/distancia";
    const DEFAULT_HEIGHT_CM = 50;
    const MAX_POINTS = 20;

    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const binFill = document.getElementById("binFill");
    const percentValue = document.getElementById("percentValue");
    const stateLabel = document.getElementById("stateLabel");
    const distanceValue = document.getElementById("distanceValue");
    const lastUpdate = document.getElementById("lastUpdate");
    const heightInput = document.getElementById("heightInput");

    heightInput.value = localStorage.getItem("bin_height_cm") || DEFAULT_HEIGHT_CM;
    let lastDistance = null;

    // Gráfico de línea
    const ctx = document.getElementById("distanceChart").getContext("2d");
    const distanceChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [
          {
            label: "Distancia (cm)",
            data: [],
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56, 189, 248, 0.15)",
            borderWidth: 2,
            tension: 0.3,
            fill: true,
            pointRadius: 3
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            ticks: { color: "#94a3b8" },
            grid: { color: "rgba(51, 65, 85, 0.4)" }
          },
          y: {
            beginAtZero: true,
            ticks: { color: "#94a3b8" },
            grid: { color: "rgba(51, 65, 85, 0.4)" }
          }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });

    function setStatus(state, text) {
      statusBadge.className = "status-badge " + state;
      statusText.textContent = text;
    }

    function renderBinState(distanciaCm) {
      const alturaTotal = parseFloat(heightInput.value) || DEFAULT_HEIGHT_CM;
      let porcentaje = ((alturaTotal - distanciaCm) / alturaTotal) * 100;
      porcentaje = Math.max(0, Math.min(100, Math.round(porcentaje)));

      distanceValue.textContent = `${distanciaCm.toFixed(1)} cm`;
      percentValue.textContent = `${porcentaje}%`;
      binFill.style.height = `${porcentaje}%`;

      if (porcentaje >= 80) {
        binFill.style.backgroundColor = "var(--danger)";
        stateLabel.textContent = "Lleno — requiere vaciado";
        stateLabel.style.color = "var(--danger)";
      } else if (porcentaje >= 50) {
        binFill.style.backgroundColor = "var(--warn)";
        stateLabel.textContent = "Nivel medio";
        stateLabel.style.color = "var(--warn)";
      } else {
        binFill.style.backgroundColor = "var(--ok)";
        stateLabel.textContent = "Espacio disponible";
        stateLabel.style.color = "var(--ok)";
      }
    }

    function updateWithReading(distanciaCm) {
      lastDistance = distanciaCm;
      const hora = new Date().toLocaleTimeString();
      lastUpdate.textContent = hora;

      renderBinState(distanciaCm);

      distanceChart.data.labels.push(hora);
      distanceChart.data.datasets[0].data.push(distanciaCm);

      if (distanceChart.data.labels.length > MAX_POINTS) {
        distanceChart.data.labels.shift();
        distanceChart.data.datasets[0].data.shift();
      }
      distanceChart.update();
    }

    // Recalcular porcentaje al instante si ajustas la altura
    heightInput.addEventListener("input", () => {
      localStorage.setItem("bin_height_cm", heightInput.value);
      if (lastDistance !== null) {
        renderBinState(lastDistance);
      }
    });

    // Conexión automática al broker HiveMQ vía WSS
    const clientId = "bin-monitor-" + Math.random().toString(16).substring(2, 10);
    setStatus("reconnecting", "Conectando...");

    const client = mqtt.connect(BROKER_URL, {
      clientId: clientId,
      clean: true,
      connectTimeout: 5000,
      reconnectPeriod: 3000
    });

    client.on("connect", () => {
      setStatus("connected", "Conectado");
      client.subscribe(TOPIC);
    });

    client.on("message", (_topic, message) => {
      const valor = parseFloat(message.toString());
      if (!isNaN(valor)) {
        updateWithReading(valor);
      }
    });

    client.on("reconnect", () => setStatus("reconnecting", "Reconectando..."));
    client.on("error", () => setStatus("error", "Error de conexión"));
    client.on("offline", () => setStatus("error", "Desconectado"));
  </script>
</body>
</html>
